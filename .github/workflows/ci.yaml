name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
      - run: go vet ./... && go test -race ./...
        working-directory: control-plane

  images:
    needs: control-plane
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: control-plane, context: control-plane }
          - { name: agent-runtime, context: agent-runtime }
          - { name: app-runtime, context: app-runtime }
          - { name: portal, context: portal }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/k-kanke/ai-app-platform/${{ matrix.name }}:latest
            ghcr.io/k-kanke/ai-app-platform/${{ matrix.name }}:${{ github.sha }}

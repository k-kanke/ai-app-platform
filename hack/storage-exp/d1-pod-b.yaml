apiVersion: v1
kind: Pod
metadata: { name: d1-pod-b, namespace: storage-lab }
spec:
  restartPolicy: Never
  nodeSelector: { kubernetes.io/hostname: ubuntu-worker-01 }
  containers:
    - name: c
      image: busybox:1.37
      command: ["sh","-c","cat /data/hello.txt; sleep 3600"]
      volumeMounts: [{ name: d, mountPath: /data }]
  volumes: [{ name: d, persistentVolumeClaim: { claimName: d1-data } }]

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご飯の予定</title>
<style>
  :root { --bg:#faf8f4; --fg:#222; --card:#fff; --line:#e4dfd5; --yes:#2e8b57; --no:#c0392b; --none:#aaa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  header { padding:12px 16px; position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); z-index:2; }
  h1 { margin:0 0 8px; font-size:20px; }
  .who { display:flex; gap:8px; flex-wrap:wrap; }
  .who button, .tabs button { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:8px 16px; font-size:16px; min-height:44px; }
  .who button.on, .tabs button.on { background:var(--fg); color:#fff; border-color:var(--fg); }
  .tabs { display:flex; gap:8px; margin-top:8px; }
  main { padding:12px 16px 48px; max-width:640px; margin:0 auto; }
  .day { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; padding:12px; }
  .day h2 { margin:0 0 8px; font-size:16px; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .row span.l { width:3em; color:#666; }
  .cell { flex:1; min-height:48px; border-radius:10px; border:2px solid var(--line); background:#fff; font-size:24px; }
  .cell.yes { color:var(--yes); border-color:var(--yes); }
  .cell.no { color:var(--no); border-color:var(--no); }
  .cell.none { color:var(--none); font-size:14px; }
  table { border-collapse:collapse; width:100%; background:var(--card); }
  th, td { border:1px solid var(--line); padding:6px; text-align:center; font-size:14px; }
  .wrap { overflow-x:auto; }
  .miss { background:#fff3cd; }
  .err { color:var(--no); padding:8px 16px; }
</style>
</head>
<body>
<header>
  <h1>🍚 ご飯の予定</h1>
  <div class="who" id="who"></div>
  <div class="tabs">
    <button id="tab-mine" class="on">自分の入力</button>
    <button id="tab-all">みんなの一覧</button>
  </div>
</header>
<div class="err" id="err" hidden></div>
<main id="main"></main>
<script src="app.js"></script>
</body>
</html>
